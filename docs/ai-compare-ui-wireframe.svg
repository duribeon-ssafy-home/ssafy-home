<svg width="1440" height="1180" viewBox="0 0 1440 1180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .surface { fill: #ffffff; }
      .soft { fill: #eef2f6; }
      .primary { fill: #365f91; }
      .primary-soft { fill: #eef4ff; }
      .accent-soft { fill: #f2ece2; }
      .danger-soft { fill: #fff1f0; }
      .safe-soft { fill: #ecfdf3; }
      .caution-soft { fill: #fffbeb; }
      .border { stroke: #e5e7eb; stroke-width: 1; }
      .border-strong { stroke: #d0d5dd; stroke-width: 1; }
      .primary-border { stroke: #365f91; stroke-width: 1.5; }
      .shadow { filter: drop-shadow(0 10px 26px rgba(15, 23, 42, 0.08)); }
      .title { font: 800 28px Pretendard, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .h2 { font: 800 21px Pretendard, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .h3 { font: 800 16px Pretendard, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .body { font: 600 14px Pretendard, "Segoe UI", Arial, sans-serif; fill: #344054; }
      .muted { font: 600 13px Pretendard, "Segoe UI", Arial, sans-serif; fill: #667085; }
      .small { font: 700 12px Pretendard, "Segoe UI", Arial, sans-serif; fill: #667085; }
      .tiny { font: 700 11px Pretendard, "Segoe UI", Arial, sans-serif; fill: #667085; }
      .white { fill: #ffffff; }
      .blue-text { fill: #243f63; }
      .danger-text { fill: #b42318; }
      .safe-text { fill: #027a48; }
      .caution-text { fill: #b45309; }
      .label { font: 800 12px Pretendard, "Segoe UI", Arial, sans-serif; fill: #243f63; letter-spacing: .2px; }
      .btn { font: 800 13px Pretendard, "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .btn-ghost { font: 800 13px Pretendard, "Segoe UI", Arial, sans-serif; fill: #243f63; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1180"/>
  <rect x="0" y="0" width="1440" height="72" fill="#ffffff" opacity="0.92"/>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#e5e7eb"/>
  <text x="72" y="44" font-family="Pretendard, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">SSAFY</text>
  <text x="136" y="44" font-family="Pretendard, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900" fill="#365f91">HOME</text>

  <rect x="300" y="20" width="82" height="34" rx="8" class="primary-soft"/>
  <text x="317" y="42" class="small blue-text">매물 찾기</text>
  <text x="408" y="42" class="small">지도로 보기</text>
  <text x="516" y="42" class="small">라이프스타일 추천</text>
  <text x="668" y="42" class="small">찜 목록</text>
  <text x="752" y="42" class="small">마이페이지</text>

  <rect x="1140" y="18" width="104" height="36" rx="8" class="surface border"/>
  <text x="1166" y="41" class="small">로그인</text>
  <rect x="1252" y="18" width="104" height="36" rx="8" class="primary"/>
  <text x="1275" y="41" class="btn">회원가입</text>

  <text x="72" y="126" class="title">AI 매물 비교 화면 시안</text>
  <text x="72" y="154" class="muted">현재 프로젝트의 compare store, /compare 라우트, 위험도/추천/생활유형 API를 AI 분석 패널과 연결하는 화면입니다.</text>

  <rect x="72" y="188" width="1296" height="96" rx="8" class="surface border shadow"/>
  <text x="96" y="222" class="h2">선택한 매물 3개</text>
  <text x="96" y="249" class="muted">최대 4개까지 비교 가능 · 매물 카드에서 비교 버튼으로 담기</text>
  <rect x="1086" y="216" width="112" height="42" rx="8" class="surface primary-border"/>
  <text x="1112" y="242" class="btn-ghost">선택 초기화</text>
  <rect x="1210" y="216" width="126" height="42" rx="8" class="primary"/>
  <text x="1238" y="242" class="btn">AI 분석하기</text>

  <g transform="translate(96 310)">
    <rect width="300" height="148" rx="8" class="surface border shadow"/>
    <rect x="14" y="14" width="104" height="86" rx="6" fill="#d9e4f2"/>
    <rect x="130" y="18" width="82" height="22" rx="6" class="primary-soft"/>
    <text x="144" y="33" class="tiny blue-text">전세</text>
    <text x="130" y="62" class="h3">역삼동 원룸 A</text>
    <text x="130" y="86" class="muted">전세 12,000만 · 23.1m2</text>
    <text x="130" y="110" class="small">위험도 SAFE · 신고 0건</text>
    <rect x="14" y="114" width="70" height="22" rx="6" class="safe-soft"/>
    <text x="27" y="129" class="tiny safe-text">안전</text>
    <rect x="92" y="114" width="92" height="22" rx="6" class="primary-soft"/>
    <text x="106" y="129" class="tiny blue-text">생활 적합</text>
  </g>

  <g transform="translate(420 310)">
    <rect width="300" height="148" rx="8" class="surface border shadow"/>
    <rect x="14" y="14" width="104" height="86" rx="6" fill="#e7ded0"/>
    <rect x="130" y="18" width="82" height="22" rx="6" class="primary-soft"/>
    <text x="144" y="33" class="tiny blue-text">월세</text>
    <text x="130" y="62" class="h3">서초동 오피스텔 B</text>
    <text x="130" y="86" class="muted">월세 65만 / 보증금 1,000만</text>
    <text x="130" y="110" class="small">위험도 CAUTION · 신고 1건</text>
    <rect x="14" y="114" width="70" height="22" rx="6" class="caution-soft"/>
    <text x="27" y="129" class="tiny caution-text">주의</text>
    <rect x="92" y="114" width="92" height="22" rx="6" class="accent-soft"/>
    <text x="107" y="129" class="tiny">역세권</text>
  </g>

  <g transform="translate(744 310)">
    <rect width="300" height="148" rx="8" class="surface border shadow"/>
    <rect x="14" y="14" width="104" height="86" rx="6" fill="#dce8df"/>
    <rect x="130" y="18" width="82" height="22" rx="6" class="primary-soft"/>
    <text x="144" y="33" class="tiny blue-text">전세</text>
    <text x="130" y="62" class="h3">논현동 투룸 C</text>
    <text x="130" y="86" class="muted">전세 18,500만 · 41.4m2</text>
    <text x="130" y="110" class="small">위험도 DANGER · 신고 3건</text>
    <rect x="14" y="114" width="70" height="22" rx="6" class="danger-soft"/>
    <text x="27" y="129" class="tiny danger-text">위험</text>
    <rect x="92" y="114" width="112" height="22" rx="6" class="primary-soft"/>
    <text x="106" y="129" class="tiny blue-text">면적 넓음</text>
  </g>

  <rect x="1068" y="310" width="268" height="148" rx="8" stroke="#d0d5dd" stroke-width="1" stroke-dasharray="7 7" fill="#ffffff"/>
  <text x="1136" y="374" class="h3" fill="#667085">비교 매물 추가</text>
  <text x="1110" y="402" class="muted">목록 또는 지도 카드에서 추가</text>

  <rect x="72" y="492" width="808" height="474" rx="8" class="surface border shadow"/>
  <text x="96" y="530" class="h2">비교 테이블</text>
  <text x="96" y="556" class="muted">정확한 값은 DB Tool에서 조회하고, AI는 해석을 담당합니다.</text>

  <rect x="96" y="586" width="760" height="48" rx="8" class="soft"/>
  <text x="122" y="616" class="label">항목</text>
  <text x="272" y="616" class="label">매물 A</text>
  <text x="456" y="616" class="label">매물 B</text>
  <text x="640" y="616" class="label">매물 C</text>

  <g class="body">
    <text x="122" y="666">가격</text>
    <text x="272" y="666">전세 12,000만</text>
    <text x="456" y="666">월세 65만</text>
    <text x="640" y="666">전세 18,500만</text>

    <text x="122" y="718">위치</text>
    <text x="272" y="718">강남구 역삼동</text>
    <text x="456" y="718">서초구 서초동</text>
    <text x="640" y="718">강남구 논현동</text>

    <text x="122" y="770">위험도</text>
    <text x="272" y="770" class="safe-text">SAFE · 18점</text>
    <text x="456" y="770" class="caution-text">CAUTION · 42점</text>
    <text x="640" y="770" class="danger-text">DANGER · 74점</text>

    <text x="122" y="822">생활 적합도</text>
    <text x="272" y="822">82점</text>
    <text x="456" y="822">76점</text>
    <text x="640" y="822">64점</text>

    <text x="122" y="874">AI 코멘트</text>
    <text x="272" y="874">안정성 우수</text>
    <text x="456" y="874">교통 편의 우수</text>
    <text x="640" y="874">신고 이력 확인 필요</text>
  </g>

  <line x1="96" y1="646" x2="856" y2="646" stroke="#e5e7eb"/>
  <line x1="96" y1="698" x2="856" y2="698" stroke="#e5e7eb"/>
  <line x1="96" y1="750" x2="856" y2="750" stroke="#e5e7eb"/>
  <line x1="96" y1="802" x2="856" y2="802" stroke="#e5e7eb"/>
  <line x1="96" y1="854" x2="856" y2="854" stroke="#e5e7eb"/>
  <line x1="244" y1="586" x2="244" y2="918" stroke="#e5e7eb"/>
  <line x1="428" y1="586" x2="428" y2="918" stroke="#e5e7eb"/>
  <line x1="612" y1="586" x2="612" y2="918" stroke="#e5e7eb"/>

  <rect x="904" y="492" width="464" height="474" rx="8" class="surface border shadow"/>
  <text x="932" y="530" class="h2">AI 분석 패널</text>
  <text x="932" y="556" class="muted">질문에 따라 Router가 RAG, DB Tool, Multi-Agent 경로를 선택합니다.</text>

  <text x="932" y="598" class="label">추천 질문</text>
  <rect x="932" y="616" width="150" height="32" rx="8" class="primary-soft"/>
  <text x="952" y="637" class="small blue-text">내 기준 추천</text>
  <rect x="1092" y="616" width="154" height="32" rx="8" class="primary-soft"/>
  <text x="1112" y="637" class="small blue-text">가장 안전한 매물</text>
  <rect x="932" y="658" width="150" height="32" rx="8" class="primary-soft"/>
  <text x="952" y="679" class="small blue-text">보증금 위험 비교</text>
  <rect x="1092" y="658" width="170" height="32" rx="8" class="primary-soft"/>
  <text x="1112" y="679" class="small blue-text">계약 전 체크리스트</text>

  <rect x="932" y="718" width="408" height="74" rx="8" class="surface border-strong"/>
  <text x="954" y="750" class="body">이 중에서 전세사기 위험이 제일 낮은 매물 알려줘</text>
  <rect x="1218" y="812" width="122" height="40" rx="8" class="primary"/>
  <text x="1247" y="837" class="btn">분석하기</text>

  <rect x="932" y="876" width="408" height="58" rx="8" class="safe-soft"/>
  <text x="954" y="900" class="h3">종합 추천: 매물 A</text>
  <text x="954" y="922" class="small">위험도, 신고 이력, 시세 대비 보증금이 가장 안정적입니다.</text>

  <rect x="932" y="950" width="86" height="28" rx="8" class="primary-soft"/>
  <text x="948" y="969" class="tiny blue-text">매물 데이터</text>
  <rect x="1026" y="950" width="92" height="28" rx="8" class="primary-soft"/>
  <text x="1042" y="969" class="tiny blue-text">위험도 분석</text>
  <rect x="1126" y="950" width="92" height="28" rx="8" class="primary-soft"/>
  <text x="1142" y="969" class="tiny blue-text">생활유형</text>
  <rect x="1226" y="950" width="96" height="28" rx="8" class="accent-soft"/>
  <text x="1242" y="969" class="tiny">RAG 문서</text>

  <rect x="72" y="1004" width="1296" height="110" rx="8" class="surface border"/>
  <text x="96" y="1038" class="h2">화면-아키텍처 연결</text>
  <text x="96" y="1070" class="body">1. 선택 매물 IDs + 질문 → /api/ai/compare</text>
  <text x="438" y="1070" class="body">2. Intent Router → 비교 분석 경로 선택</text>
  <text x="780" y="1070" class="body">3. DB Tool → 매물/위험도/생활유형 조회</text>
  <text x="96" y="1098" class="body">4. RAG → 계약/전세 체크리스트 검색</text>
  <text x="438" y="1098" class="body">5. Multi-Agent → 위험/비용/생활 적합도 분석</text>
  <text x="878" y="1098" class="body">6. Verifier → 근거 없는 답변 제거</text>
</svg>
