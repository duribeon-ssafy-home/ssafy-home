server:
  port: 8080

spring:
  application:
    name: ssafy-home

  profiles:
    include: secret

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ssafy_home?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  ai:
    openai:
      api-key: ${GOOGLE_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: gemini-2.5-flash-lite
          temperature: 0.3

jwt:
  secret: ssafy-home-local-development-secret-key-change-before-release
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 1209600

springdoc:
  swagger-ui:
    path: /swagger-ui.html

file:
  upload-dir: ./uploads

rag:
  service:
    url: ${RAG_SERVICE_URL:http://localhost:8000}
