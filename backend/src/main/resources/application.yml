server:
  port: 8080

spring:
  application:
    name: ssafy-home

  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2

  profiles:
    include: secret

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ssafy_home?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
    open-in-view: false

logging:
  level:
    root: WARN
    com.ssafy.home: INFO

jwt:
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 1209600

springdoc:
  swagger-ui:
    path: /swagger-ui.html

file:
  upload-dir: ./uploads

rag:
  service:
    url: ${RAG_SERVICE_URL:http://localhost:8000}

app:
  mail:
    from: ${SMTP_FROM:${SMTP_USERNAME:}}
  ai:
    enabled: false
    rag:
      docs-path: ../docs/ai
